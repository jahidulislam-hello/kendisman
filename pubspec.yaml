name: fitzella
description: A fitness tracking and workout planning app
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.2.0
  
  # Backend - Supabase
  supabase_flutter: ^2.5.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # HTTP & Network
  dio: ^5.4.3+1
  http: ^1.2.0
  
  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  
  # Date/Time
  intl: ^0.20.2
  timezone: ^0.9.3
  
  # Utilities
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Health Integration
  health: ^13.1.4
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  
  # Charts
  fl_chart: ^0.68.0
  
  # Image Picker
  image_picker: ^1.1.2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Device Info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.0
  
  # Biometrics
  local_auth: ^2.3.0
  
  # Haptics
  haptic_feedback: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/welcome_01.png
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Localization
flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#111924"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#111924"